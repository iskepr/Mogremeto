name: mogremeto
description: "A new Flutter Game."
version: 1.1.0

environment:
  sdk: ^3.8.0-24.0.dev

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.17
  audioplayers: ^6.1.1
  hive_flutter: ^1.1.0
  url_launcher: ^6.3.1
  supabase_flutter: ^2.8.3
  package_info_plus: ^10.2.1
  http: ^1.3.0
  hive: ^2.2.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.4.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/imgs/
    - assets/sounds/
    - stories/

  fonts:
    - family: foda
      fonts:
        - asset: assets/fonts/فودا.ttf
flutter_intl:
  enabled: true
